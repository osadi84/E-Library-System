<!-- index.html - Home Page (Dark Mode Creative Library with Logo Image and Custom Footer) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Sign in to My e-Library.">
  <meta name="theme-color" content="#121212">
  <meta property="og:type" content="website">
  <meta property="og:title" content="My e-Library - Login">
  <meta property="og:description" content="Sign in to My e-Library.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My e-Library - Login</title>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar, .footer {
      background-color: #1f1f1f;
    }
    .card {
      background-color: #2a2a2a;
      border: none;
      color: white;
    }
    .btn-custom {
      background: #4caf50;
      border: none;
      color: white;
    }
    .btn-custom:hover {
      background: #43a047;
    }
    .hero {
      background: linear-gradient(135deg, #0d0d0d, #2c3e50);
      padding: 100px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
    }
    .icon-btn {
      color: #fff;
      margin-left: 15px;
      font-size: 20px;
    }
    .icon-btn:hover {
      color: #4caf50;
    }
    .search-input {
      border-radius: 20px;
      border: none;
      padding: 5px 15px;
    }
    .navbar-brand img {
      height: 45px;
      margin-right: 10px;
    }
    .footer {
      padding: 60px 20px 20px;
    }
    .footer .row div {
      margin-bottom: 20px;
    }
    .footer a {
      color: #bbb;
      text-decoration: none;
    }
    .footer a:hover {
      color: #4caf50;
    }
    .footer i {
      margin-right: 10px;
    }
    .footer .social-icons a {
      margin-right: 10px;
      color: #bbb;
    }
    .footer .social-icons a:hover {
      color: #4caf50;
    }
  </style>
</head>
<body>
<script src="js/config.js"></script>
<script src="js/seed-books.js"></script>
<script src="js/app.js"></script>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/logo.svg" alt="Logo">
      <span class="d-none d-md-inline text-light">My e-Library</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="catalogs.html"><i class="fas fa-book-open icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="book-collection.html"><i class="fas fa-layer-group icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html"><i class="fas fa-blog icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="about.html"><i class="fas fa-info-circle icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html"><i class="fas fa-envelope icon-btn"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="help.html"><i class="fas fa-question-circle icon-btn"></i></a></li>
      </ul>
      <form class="d-flex me-3" action="search.html">
        <input class="form-control form-control-sm search-input" type="search" name="query" placeholder="Search...">
      </form>
      <a href="wishlist.html" class="icon-btn"><i class="fas fa-heart"></i></a>
      <a href="cart.html" class="icon-btn"><i class="fas fa-shopping-cart"></i></a>
      <a href="login.html" class="icon-btn"><i class="fas fa-user"></i></a>
    </div>
  </nav>

  <!-- Above head and navbar same as index.html -->

<!-- Hero -->
<section class="hero">
  <div class="container">
    <h1>Login</h1>
    <p class="lead">Access your account to continue</p>
  </div>
</section>

<!-- Main Content -->
<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body p-5">
          <h3 class="text-center mb-4">Welcome Back</h3>
          
          <div id="formAlert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control bg-dark text-white border-secondary" id="email" required>
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control bg-dark text-white border-secondary" id="password" required>
              <div class="text-end mt-1">
              </div>
            </div>
            
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-custom w-100">Login</button>
            
            <div class="text-center mt-3">
              <p class="small">Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
            
            </form>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
